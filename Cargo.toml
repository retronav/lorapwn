[package]
name = "Pipeline"
version = "0.1.0"
edition = "2021"

[dependencies]
rumqttc = "0.23"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
qdrant-client = "1.7"
uuid = { version = "1.0", features = ["v4"] }
ndarray = "0.15"
pcap-file = "1.1"
csv = "1.1"
polars = { version = "0.33.2", features = ["lazy", "json", "csv", "parquet"] }
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
