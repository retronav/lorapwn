[package]
name = "lorapwn-bench"
version = "0.1.0"
edition = "2021"
authors = ["HimuCodes"]
description = "Enhanced STM32 embedded crypto benchmark suite with power analysis"

[[bin]]
name = "stm32-benchmark"
path = "src/main.rs"

[dependencies]
# Core embedded dependencies
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", features = ["device"] }
cortex-m-semihosting = "0.5"
panic-halt = "0.2"

# Memory allocation for Vec support
alloc-cortex-m = "0.4"

# Crypto dependencies - embedded compatible versions
aes = { version = "0.8", default-features = false }
cipher = { version = "0.4", default-features = false }
cmac = { version = "0.7", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
generic-array = { version = "0.14", default-features = false }

# Math library for embedded (libm)
libm = "0.2"

# STM32 HAL with proper device support for STM32F303RE
stm32f3xx-hal = { version = "0.10", features = ["stm32f303xe", "rt"], default-features = false }

[profile.dev]
debug = true
opt-level = 1
overflow-checks = false

[profile.release]
debug = true
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = false

[features]
default = []
