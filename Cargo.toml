[package]
name = "lorapwn-bench"
version = "0.1.0"
edition = "2021"
authors = ["HimuCodes"]

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
cortex-m-semihosting = "0.5.0"
panic-halt = "0.2.0"
stm32f3xx-hal = { version = "0.9.1", features = ["stm32f303xe", "rt"] }
alloc-cortex-m = "0.4.4"
defmt = "0.3.5"
defmt-rtt = "0.4.0"

# Crypto libraries
aes = { version = "0.8.3", default-features = false }
cmac = "0.7.2"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
generic-array = "0.14.7"
digest = "0.10.7"
cipher = { version = "0.4.4", features = ["block-padding"] }

[lib]
name = "lorapwn"
path = "src/lib.rs"

[[bin]]
name = "stm32-benchmark"
path = "src/main.rs"

[profile.release]
opt-level = "s"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
debug = true        # Keep debug info for better analysis