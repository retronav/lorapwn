[package]
name = "stm32f303re-embassy-crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
# Embassy dependencies
embassy-executor = { version = "0.5", features = ["arch-cortex-m", "executor-thread", "defmt", "integrated-timers"] }
embassy-time = { version = "0.3", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-stm32 = { version = "0.1", features = ["defmt", "stm32f303re", "unstable-pac", "memory-x", "time-driver-any", "exti"] }

# Core dependencies
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

# Utilities
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
heapless = { version = "0.8", default-features = false }

# Crypto dependencies
aes = { version = "0.8", default-features = false }
cipher = { version = "0.4", default-features = false }
chacha20 = { version = "0.9", default-features = false }
poly1305 = { version = "0.8", default-features = false }

[profile.release]
debug = 2
lto = true
opt-level = 2
codegen-units = 1

[profile.dev]
debug = 2
opt-level = 1

[[bin]]
name = "embassy_crypto_benchmark"
path = "src/main.rs"