services:
  lorawan-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lorawan-dashboard
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - BIND_ADDRESS=0.0.0.0:3000
    volumes:
      # Mount data files for persistence
      - ./data:/app/data
      # Mount logs directory
      - ./logs:/app/logs
    networks:
      - lorawan-network
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant
    container_name: lorawan-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    networks:
      - lorawan-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional: Add a reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: lorawan-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - lorawan-dashboard
  #   networks:
  #     - lorawan-network
  #   restart: unless-stopped
  #   profiles:
  #     - production

networks:
  lorawan-network:
    driver: bridge

volumes:
  lorawan-data:
    driver: local
